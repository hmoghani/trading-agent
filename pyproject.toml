[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robinhood-agent"
version = "0.1.0"
description = "Robinhood Agentic Trading Platform with Autonomous Engine, Web Dashboard, and MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "google-genai>=0.1.0",
    "google-generativeai>=0.8.0",
    "mcp>=1.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
