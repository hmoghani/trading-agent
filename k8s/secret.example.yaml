apiVersion: v1
kind: Secret
metadata:
  name: robinhood-agent-secret
  namespace: robinhood
  labels:
    app: robinhood-agent
type: Opaque
stringData:
  # Replace with your actual Gemini API Key from https://aistudio.google.com/
  GEMINI_API_KEY: "AIzaSy_YOUR_GEMINI_API_KEY_HERE"
  # Secret key for encrypting dashboard session cookies
  SESSION_SECRET: "replace-with-a-secure-random-string-in-production"
  # Master password for operator access to the web dashboard
  DASHBOARD_PASSWORD: "YOUR_SECURE_MASTER_PASSWORD"
